version: '3.8'

services:
  backend:
    # build: .
    image: siddhipatil5/flask-backend:latest
    container_name: flask-backend
    ports:
      - "5000:5000"
    # volumes:
    #   - .:/app
    environment:
      - FLASK_ENV=development
    restart: always

  frontend:
    # build:
      # context: ./quiz-app
    image: siddhipatil5/react-frontend:latest
    container_name: react-frontend
    ports:
      - "3000:80"
    stdin_open: true
    tty: true
    restart: always
